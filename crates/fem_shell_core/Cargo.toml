[package]
name = "fem_shell_core"
version = "0.1.0"
edition = "2021"
description = "Compatibility shim — re-exports aeroelast-py as fem_shell_core Python module"

[lib]
name = "fem_shell_core"
crate-type = ["cdylib"]

[dependencies]
aeroelast-py = { path = "../aeroelast-py" }
pyo3 = { version = "0.28.3", features = ["extension-module"] }
