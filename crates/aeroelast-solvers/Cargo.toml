[package]
name = "aeroelast-solvers"
version = "0.1.0"
edition = "2021"
description = "PETSc/SLEPc-backed assembler and modal solver for aeroelast"
build = "build.rs"

[lib]
name = "aeroelast_solvers"
crate-type = ["rlib"]

[features]
default = ["fsi"]
fsi = ["dep:precice"]

[dependencies]
log = "0.4"
aeroelast-core = { path = "../aeroelast-core" }
precice = { version = "3.4.0", optional = true }

[build-dependencies]
pkg-config = "0.3"
