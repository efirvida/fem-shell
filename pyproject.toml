[project]
name = "fem_shell"
version = "0.1.0"
description = "Experimental FEM toolkit for shell, solid, and FSI simulations with optional preCICE coupling"
authors = [
    { name = "Eduardo Firvida", email = "efirvida@gmail.com" }
]
dependencies = [
    "gmsh>=4.15.2",
    "matplotlib>=3.10.8",
    "polars[rtcompat]>=1.40.0",
    "meshio>=5.3.5",
    "nevergrad>=1.0.12",
    "numpy>=2.4.4",
    "pyside6>=6.9.3",
    "pyvista>=0.47.3",
    "pyvistaqt>=0.11.4",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "mpi4py>=4.1.1",
    "h5py>=3.16.0",
    "numpy-stl>=3.2.0",
    "trimesh>=4.11.5",
    "networkx>=3.6.1",
    "plot3d>=1.9.1",
    "lxml>=6.1.0",
    "openpyxl>=3.1.5",
    "rich>=15.0.0",
    "textual>=8.2.4",
    "textual-plotext>=1.0.1",
    "plotext>=5.3.2",
]
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61.0", "cython>=0.29", "numpy>=2.2"]
build-backend = "setuptools.build_meta"


[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py38"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
ignore = [
  "E501", # line too long
  "B011", # 'assert False' is fine.
  "E741", # do not use variables named ‘l’, ‘O’, or ‘I’
  "C901", # fn is too complex
  "E731", # Do not assign a `lambda` expression, use a `def`
  "B904", # Within an `except` clause, raise exceptions with `raise ... from
          # err` or `raise ... from None` to distinguish them from errors in
          # exception handling

  # Might be dangerous
  "B023", # Function definition does not bind loop variable

  "ISC001", # it won't play nice with formatter
]
select = [
  "C",
  "E",
  "F",
  "W",
  "B",
  "INT",
  "ISC",    # Implicit string concat
  "G",      # f-string, %, and format in loggers is not logger-friendly.
  "RUF008",
  "W191",   # Indentation contains tabs
  "W605",   # Invalid escape sequence
  "W291",   # Trailing whitespace
  "W292",   # No newline at end of file
  "W293",   # Blank line contains whitespace
  "SIM118", # avoid 'key in dict.keys()'
  "SIM911", # use 'for k, v in dict.items()'.
  "SIM210", # use 'bool(a)' instead of 'True if a else False'
  "SIM211", # use 'not a' instead of 'False if a else True'
  "SIM401", # use 'd.get(k, default)' instead of 'd[k] if k in d else default'
  "SIM201", # use 'a != b' instead of 'not a == b'
  "SIM202", # use 'a == b' instead of 'not a != b'
  "SIM110", # https://docs.astral.sh/ruff/rules/reimplemented-builtin/
  "SIM101", # use 'isinstance(x, (T1, T2))' instead of two checks.
]

[project.scripts]
aeroelast = "fem_shell.cli.aeroelast:main"
fem-shell-fsi = "fem_shell.cli.run_fsi:main"
fem-shell-bem-fsi = "fem_shell.cli.run_bem_fsi:main"
fem-shell-monitor = "fem_shell.cli.fsi_monitor:main"
fem-shell-reconstruct-csv = "fem_shell.cli.reconstruct_rotor_csv:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]
mesh = [
    # Triangle is kept out of the base install because upstream wheels may lag
    # behind the newest CPython releases, while the rest of fem-shell can work
    # without it.
    "triangle>=20250106; python_version < '3.14'",
]
bem = [
    # CCBlade has a Fortran extension that pip cannot build reliably on its own.
    # It must be compiled and installed manually in two steps:
    #
    #   pip install meson ninja meson-python setuptools numpy
    #   git clone --depth=1 https://github.com/WISDEM/CCBlade.git /tmp/CCBlade
    #   cd /tmp/CCBlade && python setup.py build_ext --inplace
    #   pip install -e /tmp/CCBlade --no-build-isolation --no-deps
    #
    # On SDumont use the dedicated Makefile target:
    #   make -f Makefile.sdumont ccblade
    "meson",
    "meson-python",
    "ninja",
    "setuptools",
    "numpy",
    "neuralfoil",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmark tests",
    "composite: marks tests for composite materials",
]

[tool.coverage.run]
source = ["src/fem_shell"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

